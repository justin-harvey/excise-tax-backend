# API Gateway Configuration

server:
  port: 8080
  read_timeout: 30s
  write_timeout: 30s

rate_limit:
  requests_per_minute: 100
  burst: 20

cors:
  allowed_origins:
    - http://localhost:3000
    - https://tax.state.gov
    - https://admin.tax.state.gov
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed_headers:
    - Content-Type
    - Authorization

services:
  auth_url: http://localhost:8084
  payment_url: http://localhost:8081
  tax_url: http://localhost:8082
  reporting_url: http://localhost:8083

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

# JWT secret for locally validating access tokens (middleware.Auth).
# Set via the JWT_SECRET_KEY environment variable - do not commit a real
# value here, same convention as every other secret in this repo.
jwt:
  secret_key: ""

logging:
  level: info
  environment: development
