# Excise Tax Portal - Default Configuration
# This file contains default settings for local development
# Override these with environment-specific files or environment variables

server:
  host: 0.0.0.0
  port: 8080
  environment: development
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 30s

# Microservices Configuration
api_gateway:
  host: localhost
  port: 8080

payment_service:
  host: localhost
  port: 8081

tax_service:
  host: localhost
  port: 8082

reporting_service:
  host: localhost
  port: 8083

notification_service:
  host: localhost
  port: 8084

auth_service:
  host: localhost
  port: 8085

# Database Configuration
database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  dbname: excise_tax_portal
  sslmode: disable
  max_conns: 25
  min_conns: 5
  max_conn_lifetime: 1h
  max_conn_idle_time: 30m

# Redis Configuration
redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  max_retries: 3
  min_idle_conns: 5
  pool_size: 10
  conn_max_idle_time: 5m

# RabbitMQ Configuration
rabbitmq:
  host: localhost
  port: 5672
  user: guest
  password: guest
  vhost: /

# S3/MinIO Configuration
s3:
  endpoint: http://localhost:9000
  access_key_id: minioadmin
  secret_access_key: minioadmin
  bucket_name: excise-tax-reports
  region: us-east-1
  use_ssl: false

# JWT Configuration
jwt:
  secret_key: dev-secret-key-change-in-production-min-32-chars
  access_token_duration: 15m
  refresh_token_duration: 168h  # 7 days
  issuer: excise-tax-portal

# Logger Configuration
logger:
  level: debug
  environment: development

# CORS Configuration
cors:
  allowed_origins:
    - http://localhost:3000
    - http://localhost:5173
    - http://localhost:8080
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
    - OPTIONS
  allowed_headers:
    - Content-Type
    - Authorization
    - X-Request-ID
  allow_credentials: true
  max_age: 3600

# Rate Limiting
rate_limit:
  enabled: true
  requests_per_min: 100
  burst_size: 20
  cleanup_period: 1m

# XRPL Configuration
xrpl:
  network_url: wss://s.altnet.rippletest.net:51233
  wallet_address: ""
  wallet_seed: ""
  is_testnet: true
  sync_interval: 5s
  confirmation_min: 1
