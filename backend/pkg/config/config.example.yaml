# Example configuration file for Excise Tax Portal
# Copy this file to config.yaml and update with your values

server:
  host: "0.0.0.0"
  port: 8080
  environment: "development" # development, staging, production
  read_timeout: 15s
  write_timeout: 15s
  shutdown_timeout: 30s

# Microservices endpoints
api_gateway:
  host: "localhost"
  port: 8080

payment_service:
  host: "localhost"
  port: 8081

tax_service:
  host: "localhost"
  port: 8082

reporting_service:
  host: "localhost"
  port: 8083

notification_service:
  host: "localhost"
  port: 8084

auth_service:
  host: "localhost"
  port: 8085

# Database configuration
database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  dbname: "excise_tax_portal"
  sslmode: "disable" # disable, require, verify-ca, verify-full
  max_conns: 25
  min_conns: 5
  max_conn_lifetime: 1h
  max_conn_idle_time: 30m

# Redis configuration
redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  max_retries: 3
  min_idle_conns: 5
  pool_size: 10
  conn_max_idle_time: 5m

# RabbitMQ configuration
rabbitmq:
  host: "localhost"
  port: 5672
  user: "guest"
  password: "guest"
  vhost: "/"

# S3/MinIO configuration
s3:
  endpoint: "localhost:9000"
  access_key_id: "minioadmin"
  secret_access_key: "minioadmin"
  bucket_name: "excise-tax-documents"
  region: "us-east-1"
  use_ssl: false

# JWT configuration
jwt:
  secret_key: "your-secret-key-must-be-at-least-32-characters-long-change-in-production"
  access_token_duration: 15m
  refresh_token_duration: 168h # 7 days
  issuer: "excise-tax-portal"

# Logger configuration
logger:
  level: "info" # debug, info, warn, error, fatal
  environment: "development" # development, production

# CORS configuration
cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:3001"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "PATCH"
    - "OPTIONS"
  allowed_headers:
    - "Content-Type"
    - "Authorization"
    - "X-Request-ID"
  allow_credentials: true
  max_age: 300

# Rate limiting configuration
rate_limit:
  enabled: true
  requests_per_min: 100
  burst_size: 20
  cleanup_period: 1m

# XRPL blockchain configuration
xrpl:
  network_url: "wss://s.altnet.rippletest.net:51233" # Testnet
  wallet_address: ""
  wallet_seed: ""
  is_testnet: true
  sync_interval: 5s
  confirmation_min: 1
