openapi: 3.0.3
info:
  title: XRPL Excise Tax API
  description: |
    RESTful API for XRPL integration and excise tax calculations.
    
    This API provides endpoints to:
    - Query account balances and information  
    - Retrieve transaction details and history
    - Verify transaction status
    - Calculate excise taxes for alcoholic beverage production
    - Get current tax rates and product types
    
    All CLI functionality is accessible via these REST endpoints.
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://api-staging.example.com
    description: Staging server
  - url: https://api.example.com
    description: Production server

tags:
  - name: Health
    description: Health check and readiness endpoints
  - name: Accounts
    description: XRPL account operations
  - name: Transactions
    description: XRPL transaction operations
  - name: Tax
    description: Excise tax calculation and rates

paths:
  /health:
    get:
      tags:
        - Health
      summary: Basic health check
      description: Returns a simple health check indicating the API is running
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                timestamp: "2026-01-03T10:00:00Z"

  /health/ready:
    get:
      tags:
        - Health
      summary: Readiness check
      description: Checks if the service is ready to accept traffic (includes XRPL connection check)
      operationId: readinessCheck
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /health/live:
    get:
      tags:
        - Health
      summary: Liveness check
      description: Indicates if the service process is alive
      operationId: livenessCheck
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /info:
    get:
      tags:
        - Health
      summary: API information
      description: Returns API version and capabilities
      operationId: getInfo
      responses:
        '200':
          description: API information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'

  /xrpl/accounts/{address}/balance:
    get:
      tags:
        - Accounts
      summary: Get account balance
      description: Retrieves the XRP balance for an XRPL account
      operationId: getAccountBalance
      parameters:
        - $ref: '#/components/parameters/AddressPath'
      responses:
        '200':
          description: Account balance retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
              example:
                account: rPEPPER7kfTD9w2To4CQk6UCfuHM9c6GDY
                balance_xrp: "777.495588"
                balance_drops: 777495588
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /xrpl/accounts/{address}/info:
    get:
      tags:
        - Accounts
      summary: Get account information
      description: Retrieves detailed information for an XRPL account
      operationId: getAccountInfo
      parameters:
        - $ref: '#/components/parameters/AddressPath'
      responses:
        '200':
          description: Account information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInfoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /xrpl/accounts/{address}/transactions:
    get:
      tags:
        - Accounts
      summary: Get account transaction history
      description: Retrieves transaction history for an XRPL account with pagination
      operationId: getAccountTransactions
      parameters:
        - $ref: '#/components/parameters/AddressPath'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Transaction history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /xrpl/transactions/{hash}:
    get:
      tags:
        - Transactions
      summary: Get transaction details
      description: Retrieves detailed information about a specific transaction
      operationId: getTransaction
      parameters:
        - $ref: '#/components/parameters/HashPath'
      responses:
        '200':
          description: Transaction details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /xrpl/transactions/{hash}/status:
    get:
      tags:
        - Transactions
      summary: Verify transaction status
      description: Verifies the validation status of a transaction
      operationId: getTransactionStatus
      parameters:
        - $ref: '#/components/parameters/HashPath'
      responses:
        '200':
          description: Transaction status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tax/rates:
    get:
      tags:
        - Tax
      summary: Get current tax rates
      description: Retrieves current excise tax rates for all product types
      operationId: getTaxRates
      parameters:
        - name: jurisdiction
          in: query
          required: false
          description: Filter by jurisdiction (e.g., federal, california)
          schema:
            type: string
            example: federal
      responses:
        '200':
          description: Tax rates retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxRatesResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /tax/calculate:
    post:
      tags:
        - Tax
      summary: Calculate excise tax
      description: Calculates excise tax for given production data
      operationId: calculateTax
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxCalculationRequest'
            example:
              production_data:
                items:
                  - product_type: beer
                    product_name: IPA Batch #123
                    unit_type: gallon
                    quantity: 100.5
                    abv: 6.5
                    notes: Seasonal IPA
              jurisdiction: federal
              effective_date: "2026-01-04T10:00:00Z"
      responses:
        '200':
          description: Tax calculation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxCalculationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /tax/validate:
    post:
      tags:
        - Tax
      summary: Validate production data
      description: Validates production data without calculating taxes
      operationId: validateProductionData
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionDataRequest'
      responses:
        '200':
          description: Validation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /tax/product-types:
    get:
      tags:
        - Tax
      summary: Get supported product types
      description: Returns list of supported alcoholic beverage product types
      operationId: getProductTypes
      responses:
        '200':
          description: Product types retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductTypesResponse'

components:
  parameters:
    AddressPath:
      name: address
      in: path
      required: true
      description: XRPL account address (starts with 'r')
      schema:
        type: string
        pattern: '^r[a-zA-Z0-9]{24,34}$'
        example: rPEPPER7kfTD9w2To4CQk6UCfuHM9c6GDY

    HashPath:
      name: hash
      in: path
      required: true
      description: Transaction hash (64-character hex string)
      schema:
        type: string
        pattern: '^[0-9A-Fa-f]{64}$'
        example: 3B4D6B3F5E2A1C8D9F0A7B6C5E4D3A2B1C0D9E8F7A6B5C4D3E2F1A0B9C8D7E6F

    LimitQuery:
      name: limit
      in: query
      required: false
      description: Maximum number of transactions to return (1-100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time

    ReadinessResponse:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          example: ready
        checks:
          type: object
          properties:
            xrpl:
              type: string
              example: connected

    InfoResponse:
      type: object
      required:
        - version
        - environment
        - capabilities
      properties:
        version:
          type: string
          example: "1.0.0"
        environment:
          type: string
          enum: [development, staging, production]
        golang_version:
          type: string
          example: go1.22.0
        capabilities:
          type: array
          items:
            type: string
          example:
            - xrpl_account_balance
            - xrpl_account_info
            - xrpl_transaction_details

    BalanceResponse:
      type: object
      required:
        - account
        - balance_xrp
        - balance_drops
      properties:
        account:
          type: string
          description: XRPL account address
        balance_xrp:
          type: string
          description: Balance in XRP (human-readable)
          example: "777.495588"
        balance_drops:
          type: integer
          description: Balance in drops (1 XRP = 1,000,000 drops)
          example: 777495588

    AccountInfoResponse:
      type: object
      required:
        - account
        - balance_xrp
        - balance_drops
        - sequence
      properties:
        account:
          type: string
        balance_xrp:
          type: string
        balance_drops:
          type: integer
        sequence:
          type: integer
          description: Account sequence number
        flags:
          type: integer
          description: Account flags
        owner_count:
          type: integer
          description: Number of objects owned
        previous_txn_id:
          type: string
          description: Hash of previous transaction
        previous_txn_lgr_seq:
          type: integer
          description: Ledger sequence of previous transaction

    TransactionsResponse:
      type: object
      required:
        - account
        - limit
        - count
        - transactions
      properties:
        account:
          type: string
        limit:
          type: integer
        count:
          type: integer
          description: Number of transactions returned
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'

    Transaction:
      type: object
      description: XRPL transaction object
      properties:
        hash:
          type: string
        ledger_index:
          type: integer
        date:
          type: integer
        tx:
          type: object
          description: Transaction details

    TransactionResponse:
      type: object
      required:
        - hash
        - transaction
      properties:
        hash:
          type: string
        transaction:
          $ref: '#/components/schemas/Transaction'

    TransactionStatusResponse:
      type: object
      required:
        - hash
        - validated
        - status
      properties:
        hash:
          type: string
        validated:
          type: boolean
          description: Whether the transaction is validated
        status:
          type: string
          description: Transaction status
        ledger_index:
          type: integer
          description: Ledger index where transaction was included

    TaxRatesResponse:
      type: object
      required:
        - rates
      properties:
        rates:
          type: array
          items:
            $ref: '#/components/schemas/TaxRate'

    TaxRate:
      type: object
      required:
        - product_type
        - rate_per_unit
        - unit_type
        - effective_date
        - jurisdiction
      properties:
        product_type:
          type: string
          enum: [beer, wine, spirits, other]
          example: beer
        rate_per_unit:
          type: number
          format: float
          description: Tax rate per unit
          example: 0.58
        unit_type:
          type: string
          enum: [gallon, barrel, case, liter]
          example: gallon
        effective_date:
          type: string
          format: date-time
          description: When this rate becomes effective
        expiration_date:
          type: string
          format: date-time
          nullable: true
          description: When this rate expires (null = no expiration)
        description:
          type: string
          example: Federal excise tax on beer
        jurisdiction:
          type: string
          example: federal

    TaxCalculationRequest:
      type: object
      required:
        - production_data
      properties:
        production_data:
          $ref: '#/components/schemas/ProductionData'
        jurisdiction:
          type: string
          default: federal
          example: federal
        effective_date:
          type: string
          format: date-time
          nullable: true
          description: Date for tax calculation (null = current time)

    ProductionData:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductionItem'

    ProductionItem:
      type: object
      required:
        - product_type
        - product_name
        - unit_type
        - quantity
      properties:
        product_type:
          type: string
          enum: [beer, wine, spirits, other]
        product_name:
          type: string
          example: IPA Batch #123
        unit_type:
          type: string
          enum: [gallon, barrel, case, liter]
        quantity:
          type: number
          format: float
          minimum: 0
          example: 100.5
        abv:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Alcohol by volume (percentage)
          example: 6.5
        notes:
          type: string
          example: Seasonal IPA

    TaxCalculationResponse:
      type: object
      required:
        - calculation
      properties:
        calculation:
          $ref: '#/components/schemas/TaxCalculation'

    TaxCalculation:
      type: object
      required:
        - total_tax_amount
        - breakdown_by_product
        - calculated_at
        - jurisdiction
      properties:
        total_tax_amount:
          type: number
          format: float
          example: 58.29
        breakdown_by_product:
          type: array
          items:
            $ref: '#/components/schemas/TaxCalculationProduct'
        calculated_at:
          type: string
          format: date-time
        jurisdiction:
          type: string
          example: federal

    TaxCalculationProduct:
      type: object
      required:
        - product_type
        - product_name
        - quantity
        - unit_type
        - rate_per_unit
        - tax_amount
      properties:
        product_type:
          type: string
          enum: [beer, wine, spirits, other]
        product_name:
          type: string
        quantity:
          type: number
          format: float
        unit_type:
          type: string
          enum: [gallon, barrel, case, liter]
        rate_per_unit:
          type: number
          format: float
        tax_amount:
          type: number
          format: float

    ProductionDataRequest:
      type: object
      required:
        - production_data
      properties:
        production_data:
          $ref: '#/components/schemas/ProductionData'

    ValidationResponse:
      type: object
      required:
        - valid
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'

    ValidationError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: items[0].quantity
        message:
          type: string
          example: quantity must be greater than 0

    ProductTypesResponse:
      type: object
      required:
        - product_types
      properties:
        product_types:
          type: array
          items:
            type: object
            required:
              - type
              - description
            properties:
              type:
                type: string
                enum: [beer, wine, spirits, other]
              description:
                type: string
              unit_types:
                type: array
                items:
                  type: string
                  enum: [gallon, barrel, case, liter]

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - type
            - title
            - status
          properties:
            type:
              type: string
              description: URI reference for error type
              example: https://api.example.com/errors/404
            title:
              type: string
              description: Short, human-readable error summary
              example: Not Found
            status:
              type: integer
              description: HTTP status code
              example: 404
            detail:
              type: string
              description: Human-readable explanation
              example: The requested resource could not be found
            instance:
              type: string
              description: URI reference for this specific error occurrence
              example: /xrpl/accounts/invalid_address/balance

  responses:
    BadRequest:
      description: Bad request - invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: https://api.example.com/errors/400
              title: Bad Request
              status: 400
              detail: invalid XRPL address format
              instance: /xrpl/accounts/invalid/balance

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: https://api.example.com/errors/404
              title: Not Found
              status: 404
              detail: The requested resource could not be found
              instance: /xrpl/accounts/rNotFound/balance

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: https://api.example.com/errors/500
              title: Internal Server Error
              status: 500
              detail: The server encountered an unexpected error
              instance: /xrpl/accounts/rSomeAccount/balance

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT authentication (for future use)

security: []
