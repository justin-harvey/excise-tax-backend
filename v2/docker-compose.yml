version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: excise-tax-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-excise_tax_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - excise-tax-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-excise_tax_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # XRPL API Service (Development)
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: xrpl-api-dev
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "8080:8080"
    environment:
      - ENV=development
      - API_PORT=8080
      - XRPL_URL=${XRPL_URL:-wss://s.altnet.rippletest.net:51233}
      - LOG_LEVEL=debug
      - LOG_FORMAT=text
    volumes:
      - ./api:/home/app/api:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - excise-tax-network

  # XRPL API Service (Production)
  api-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xrpl-api-prod
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "8080:8080"
    environment:
      - ENV=production
      - API_PORT=8080
      - XRPL_URL=${XRPL_URL:-wss://xrplcluster.com}
      - LOG_LEVEL=info
      - LOG_FORMAT=json
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - excise-tax-network

  # Swagger UI for API documentation
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: xrpl-swagger-ui
    restart: unless-stopped
    profiles: ["dev", "prod"]
    ports:
      - "8081:8080"
    environment:
      - SWAGGER_JSON=/api/openapi.yaml
      - BASE_URL=/swagger
      - DEEP_LINKING=true
      - DISPLAY_REQUEST_DURATION=true
    volumes:
      - ./api/openapi.yaml:/api/openapi.yaml:ro
    networks:
      - excise-tax-network

  # Development service (legacy - for v1 services if needed)
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: excise-tax-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=${SERVER_PORT:-9000}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB:-excise_tax_db}
      - DB_SSLMODE=disable
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_DURATION=${JWT_ACCESS_TOKEN_DURATION:-1h}
      - JWT_REFRESH_TOKEN_DURATION=${JWT_REFRESH_TOKEN_DURATION:-168h}
    ports:
      - "${SERVER_PORT:-9000}:9000"
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - excise-tax-network
    profiles:
      - legacy-dev

  # Production release service (legacy - for v1 services if needed)
  release:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: excise-tax-release
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=${SERVER_PORT:-9000}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB:-excise_tax_db}
      - DB_SSLMODE=disable
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - JWT_ACCESS_TOKEN_DURATION=${JWT_ACCESS_TOKEN_DURATION:-1h}
      - JWT_REFRESH_TOKEN_DURATION=${JWT_REFRESH_TOKEN_DURATION:-168h}
    ports:
      - "${SERVER_PORT:-9000}:9000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - excise-tax-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - legacy-release

  # Test service - runs tests in isolated environment
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: excise-tax-test
    env_file:
      - .env
    environment:
      - APP_ENV=test
      - CGO_ENABLED=1  # Enable for race detector
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - test-results:/app/test-results
    networks:
      - excise-tax-network
    profiles:
      - test
    command: >
      sh -c "
        echo 'Running tests with race detector...' &&
        go test -v -race -coverprofile=coverage.out -covermode=atomic ./... &&
        echo 'Tests completed successfully!' &&
        echo 'Coverage report:' &&
        go tool cover -func=coverage.out
      "

networks:
  excise-tax-network:
    name: excise-tax-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
    name: excise-tax-postgres-data
  go-mod-cache:
    name: excise-tax-go-mod-cache
  test-results:
    name: excise-tax-test-results
