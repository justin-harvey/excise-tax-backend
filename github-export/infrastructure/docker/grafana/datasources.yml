# Grafana Datasource Configuration for Excise Tax Portal

apiVersion: 1

# List of datasources to insert/update
datasources:
  # Prometheus datasource
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      queryTimeout: 60s
      # Enable alerting
      manageAlerts: true
      # Prometheus type and version
      prometheusType: Prometheus
      prometheusVersion: 2.40.0
      # Cache settings
      cacheLevel: 'High'
      incrementalQuerying: true
      incrementalQueryOverlapWindow: 10m
    version: 1

  # PostgreSQL datasource (optional, requires grafana-postgresql-datasource plugin)
  # Uncomment when PostgreSQL direct querying is needed
  # - name: PostgreSQL
  #   type: postgres
  #   access: proxy
  #   url: postgres:5432
  #   database: excise_tax_db
  #   user: postgres
  #   secureJsonData:
  #     password: postgres
  #   jsonData:
  #     sslmode: disable
  #     maxOpenConns: 10
  #     maxIdleConns: 10
  #     connMaxLifetime: 14400
  #     postgresVersion: 1500
  #     timescaledb: false
  #   editable: true
  #   version: 1

