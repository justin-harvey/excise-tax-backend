# Prometheus Configuration for Excise Tax Portal

global:
  scrape_interval: 15s # Default scrape interval
  evaluation_interval: 15s # Evaluate rules every 15 seconds
  scrape_timeout: 10s
  external_labels:
    environment: 'development'
    project: 'excise-tax-portal'

# Alertmanager configuration (optional, can be added later)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Load rules once and periodically evaluate them
# rule_files:
#   - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # PostgreSQL monitoring (requires postgres_exporter)
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgresql'
    # Uncomment when postgres_exporter is added
    # metrics_path: /metrics

  # Redis monitoring (requires redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
    # Uncomment when redis_exporter is added
    # metrics_path: /metrics

  # RabbitMQ monitoring (built-in Prometheus support)
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
        labels:
          service: 'rabbitmq'
    # Note: Requires RabbitMQ Prometheus plugin to be enabled

  # Node.js Application monitoring (future)
  - job_name: 'backend-api'
    static_configs:
      - targets: ['backend:3000']
        labels:
          service: 'backend-api'
    metrics_path: '/metrics'
    # Uncomment when backend application is containerized

  # Frontend monitoring (future)
  - job_name: 'frontend'
    static_configs:
      - targets: ['frontend:3001']
        labels:
          service: 'frontend'
    metrics_path: '/metrics'
    # Uncomment when frontend application is containerized

  # Docker container monitoring (requires cadvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
    # Uncomment when cadvisor is added for container metrics

  # Node exporter for host metrics (optional)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
    # Uncomment when node-exporter is added for host system metrics

# Remote write configuration (for long-term storage, optional)
# remote_write:
#   - url: "http://victoria-metrics:8428/api/v1/write"
#     queue_config:
#       max_samples_per_send: 10000
#       capacity: 20000

# Remote read configuration (optional)
# remote_read:
#   - url: "http://victoria-metrics:8428/api/v1/read"
